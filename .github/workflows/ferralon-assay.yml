# Ferralon Assay — free, deterministic dependency-advisory scan, run in this repository's own
# GitHub runner via the ferralon-ai/ferralon-assay Action (floating @v0.3 alias; scanner bytes stay
# exact via the alias leaf's scanner-version default). No scanner binary is committed here.
#
# Added by the fixture layout standard (pipeline-test 1.3, 2026-09-22; finding H1 — this
# case-study repository previously had no in-repo scan at all).
#
# FIXTURE LAYOUT STANDARD. `baseline` (the historical vulnerable snapshot) and the reference
# patches (`fix`) are GOLDEN: never scanned, never the default branch, protected per
# repo in the backend. `main` is the default branch, the only scanned branch, and the disposable
# fire target — reset from `baseline` with `.demo/prep-demo.sh`. GitHub matches the push filter
# against the copy of this file ON THE PUSHED BRANCH, so `baseline`'s copy must name `main` too
# (prep-demo.sh resets `main` from `baseline`, so that copy is the one that survives).
#
# FIRST-RUN CAVEAT (stated, not hidden): this workflow has never run in this repository. It runs no Node setup (the scan reads the lockfile, the same shape airflow's Python scan uses); if the first run needs installed packages, add actions/setup-node + an install step before the scan.
# A scan whose work set resolves to zero advisories FAILS the run by design (ferralon-assay
# action.yml) — a red first run is information, not necessarily a broken workflow.

name: Ferralon Assay

on:
  pull_request:
  push:
    # The disposable default branch only. branches: cannot use a default_branch expression.
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "53 3 * * *" # daily, off the top of the hour
  repository_dispatch:
    types: [ferralon-advisory-rescan]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the Ferralon Assay
        id: scan
        uses: ferralon-ai/ferralon-assay@v0.3
        with:
          mode: baseline
          target: .
          out: ${{ runner.temp }}/out
          subject-repo: ${{ github.repository }}
          revision: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          # Persist the durable StateStore baseline only on the default branch. A PR run stays
          # stateless and never overwrites the baseline. state-ref is the cross-team-contract ref.
          # Link this repo's runs to the Ferralon console: a canonical-ref (main) run pushes its
          # report to the run-snapshot sink (report_runs). The auto-prove worker enumerates
          # fireable runs ONLY from report_runs, so an unlinked scan is invisible to the fire plane.
          link-to-console: "true"
          # STOPGAP (F28, confirmed 2026-09-22 on airflow): the pinned release carries no baked
          # run-snapshot endpoint, so without this a linked run silently pushes nothing.
          # Delete once the release bakes ASSAY_RUNS_URL.
          runs-url: https://api.ferralon.com/runs
          state-ref: refs/tegron/state
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}

      - name: Upload the scan report bundle (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            ${{ steps.scan.outputs.out-dir }}/report.json
            ${{ steps.scan.outputs.out-dir }}/report.html
            ${{ steps.scan.outputs.out-dir }}/report.sarif.json
            ${{ steps.scan.outputs.out-dir }}/openvex.json
          if-no-files-found: error
